services:
  storage-tracker:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Set this to the Pi's reserved IP or stable hostname before printing labels.
      # PUBLIC_URL: http://192.168.1.50:8080
    volumes:
      - storage-data:/app/data
volumes:
  storage-data:
